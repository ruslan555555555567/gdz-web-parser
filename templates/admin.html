<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка — GDZ Парсер</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="topbar">
            <span class="version">v{{ version }}</span>
            <a href="/" class="support-btn" title="На главную">🏠</a>
        </div>

        <h1>🔐 Админка</h1>
        <p class="subtitle">Сообщения от пользователей</p>

        <!-- Форма входа -->
        <section class="card" id="loginCard">
            <h2>Введите пароль</h2>
            <form id="loginForm">
                <input type="password" id="pwd" class="num-input"
                    placeholder="Пароль" autocomplete="current-password">
                <div id="loginStatus" class="fb-status"></div>
                <button type="submit" class="btn-primary" style="margin-top: 12px;">
                    Войти
                </button>
            </form>
        </section>

        <!-- Список сообщений -->
        <section class="card hidden" id="messagesCard">
            <div class="section-header">
                <h2>📬 Сообщения (<span id="count">0</span>)</h2>
                <button id="refreshBtn" class="btn-small">🔄 Обновить</button>
            </div>
            <div id="messagesList"></div>
            <div id="emptyMsg" class="empty">Пока сообщений нет</div>
        </section>

        <!-- Кнопка очистки -->
        <div id="footerActions" class="hidden" style="text-align:center; margin-top:20px;">
            <button id="clearBtn" class="btn-secondary">🗑 Удалить все сообщения</button>
        </div>
    </div>

    <script>
        let currentPassword = '';

        const loginCard = document.getElementById('loginCard');
        const messagesCard = document.getElementById('messagesCard');
        const loginForm = document.getElementById('loginForm');
        const pwd = document.getElementById('pwd');
        const loginStatus = document.getElementById('loginStatus');
        const messagesList = document.getElementById('messagesList');
        const emptyMsg = document.getElementById('emptyMsg');
        const countEl = document.getElementById('count');
        const refreshBtn = document.getElementById('refreshBtn');
        const clearBtn = document.getElementById('clearBtn');
        const footerActions = document.getElementById('footerActions');

        // ─── ВХОД ПО ПАРОЛЮ ─────────────────────────────
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = pwd.value;
            if (!password) return;

            loginStatus.textContent = '⏳ Проверяем...';
            loginStatus.className = 'fb-status loading';

            try {
                const resp = await fetch('/api/admin/messages', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password})
                });
                if (!resp.ok) {
                    loginStatus.textContent = '❌ Неверный пароль';
                    loginStatus.className = 'fb-status error';
                    return;
                }
                const data = await resp.json();
                currentPassword = password;
                loginCard.classList.add('hidden');
                messagesCard.classList.remove('hidden');
                footerActions.classList.remove('hidden');
                renderMessages(data.messages);
            } catch (err) {
                loginStatus.textContent = '❌ ' + err.message;
                loginStatus.className = 'fb-status error';
            }
        });

        // ─── ОБНОВИТЬ СПИСОК ────────────────────────────
        refreshBtn.addEventListener('click', loadMessages);

        async function loadMessages() {
            try {
                const resp = await fetch('/api/admin/messages', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password: currentPassword})
                });
                if (!resp.ok) {
                    alert('Сессия истекла. Обновите страницу.');
                    return;
                }
                const data = await resp.json();
                renderMessages(data.messages);
            } catch (err) {
                alert('Ошибка: ' + err.message);
            }
        }

        // ─── ОЧИСТИТЬ ВСЁ ───────────────────────────────
        clearBtn.addEventListener('click', async () => {
            if (!confirm('Удалить ВСЕ сообщения? Это нельзя отменить.')) return;
            try {
                const resp = await fetch('/api/admin/clear', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password: currentPassword})
                });
                if (!resp.ok) throw new Error('Ошибка');
                renderMessages([]);
            } catch (err) {
                alert('Не удалось удалить: ' + err.message);
            }
        });

        // ─── ОТРИСОВКА ──────────────────────────────────
        function renderMessages(messages) {
            countEl.textContent = messages.length;
            messagesList.innerHTML = '';

            if (messages.length === 0) {
                emptyMsg.style.display = 'block';
                return;
            }
            emptyMsg.style.display = 'none';

            messages.forEach(m => {
                const div = document.createElement('div');
                div.className = 'message-card';
                div.innerHTML = `
                    <div class="msg-head">
                        <span class="msg-date">📅 ${escapeHtml(m.date || '')}</span>
                        <span class="msg-ver">v${escapeHtml(m.version || '?')}</span>
                    </div>
                    <div class="msg-body">${escapeHtml(m.message || '')}</div>
                    ${m.contact
                        ? `<div class="msg-contact">📞 ${escapeHtml(m.contact)}</div>`
                        : ''}
                `;
                messagesList.appendChild(div);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
