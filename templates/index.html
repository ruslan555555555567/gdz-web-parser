<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDZ Парсер — 7 класс</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="topbar">
            <span class="version">v{{ version }}</span>
            <div class="topbar-right" id="topbarRight"></div>
        </div>

        <h1>📚 GDZ Парсер</h1>
        <p class="subtitle">7 класс · Введи номера заданий</p>

        <section class="card">
            <h2>📝 Домашка</h2>

            <div class="input-row">
                <label class="input-label">📐 Алгебра <span class="hint">(Макарычев)</span></label>
                <input type="text" class="num-input" id="algebra"
                    placeholder="447, 449, 451(а,в,д), 455, 459">
            </div>

            <div class="input-row">
                <label class="input-label">📖 Русский язык <span class="hint">(Баранов)</span></label>
                <input type="text" class="num-input" id="russian"
                    placeholder="1, 5, 10 или стр. 8, 12">
            </div>

            <div class="input-row">
                <label class="input-label">📐 Геометрия <span class="hint">(Мерзляк)</span></label>
                <input type="text" class="num-input" id="geometry"
                    placeholder="1, 5, 10, 15">
            </div>

            <button id="btn" class="btn-primary">🔍 Найти решения</button>
        </section>

        <div id="status" class="status"></div>
        <div id="result" class="result"></div>

        <footer class="footer">
            <span>GDZ Парсер · v{{ version }}</span>
        </footer>
    </div>

    <!-- ═══════ ПРИВЕТСТВЕННОЕ МЕНЮ ═══════ -->
    <div id="welcomeModal" class="modal hidden">
        <div class="modal-content welcome-content">
            <h2>Добро пожаловать! 👋</h2>
            <p class="modal-text">Как будем заходить?</p>
            <button id="guestBtn" class="welcome-btn guest">
                <span class="wb-icon">👤</span>
                <div class="wb-text">
                    <strong>Гость</strong>
                    <small>История не сохраняется</small>
                </div>
            </button>
            <button id="authBtn" class="welcome-btn auth">
                <span class="wb-icon">🔑</span>
                <div class="wb-text">
                    <strong>Войти / Регистрация</strong>
                    <small>История поисков сохраняется</small>
                </div>
            </button>
        </div>
    </div>

    <!-- ═══════ ВХОД / РЕГИСТРАЦИЯ ═══════ -->
    <div id="authModal" class="modal hidden">
        <div class="modal-content">
            <h3 id="authTitle">Вход</h3>

            <div class="auth-tabs">
                <button type="button" class="auth-tab active" data-tab="login">Вход</button>
                <button type="button" class="auth-tab" data-tab="register">Регистрация</button>
            </div>

            <form id="authForm">
                <label class="form-label" id="nameField" style="display:none;">
                    Имя
                    <input type="text" id="authName" placeholder="Как тебя зовут">
                </label>
                <label class="form-label">
                    Email
                    <input type="email" id="authEmail" placeholder="you@example.com" required>
                </label>
                <label class="form-label">
                    Пароль
                    <input type="password" id="authPwd" placeholder="минимум 6 символов" required>
                </label>
                <div id="authStatus" class="fb-status"></div>
                <div class="modal-actions">
                    <button type="button" id="authCancel" class="btn-secondary">Отмена</button>
                    <button type="submit" id="authSubmit" class="btn-primary">Войти</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ═══════ ИСТОРИЯ ═══════ -->
    <div id="historyModal" class="modal hidden">
        <div class="modal-content">
            <h3>📜 История поисков</h3>
            <div id="historyList"></div>
            <div class="modal-actions">
                <button id="clearHistoryBtn" class="btn-secondary">🗑 Очистить</button>
                <button id="closeHistoryBtn" class="btn-primary">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- ═══════ ТЕХПОДДЕРЖКА ═══════ -->
    <div id="supportModal" class="modal hidden">
        <div class="modal-content">
            <h3>💬 Техподдержка</h3>
            <p class="modal-text">Нашли ошибку или есть вопрос? Напишите — мы ответим.</p>
            <form id="feedbackForm">
                <label class="form-label">
                    Сообщение <span class="required">*</span>
                    <textarea id="fbMessage" rows="4" placeholder="Опишите проблему..."></textarea>
                </label>
                <label class="form-label">
                    Контакт <span class="hint">(необязательно)</span>
                    <input type="text" id="fbContact" placeholder="Telegram, email">
                </label>
                <div id="fbStatus" class="fb-status"></div>
                <div class="modal-actions">
                    <button type="button" id="closeSupport" class="btn-secondary">Отмена</button>
                    <button type="submit" id="fbSubmit" class="btn-primary">Отправить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ═══════ МОДАЛКА КАРТИНКИ ═══════ -->
    <div id="imageModal" class="modal hidden">
        <div class="image-modal-content">
            <button id="closeImageModal" class="image-modal-close">✕</button>
            <img id="imageModalImg" src="" alt="">
        </div>
    </div>

    <script>
        const SUBJECTS = [
            { id: 'algebra', subject: 'Алгебра', url: 'https://gdz.ru/class-7/algebra/makarichev-18/' },
            { id: 'russian', subject: 'Русский язык', url: 'https://gdz.ru/class-7/russkii_yazik/baranova/' },
            { id: 'geometry', subject: 'Геометрия', url: 'https://gdz.ru/class-7/geometria/merzljak/' },
        ];

        // ─── СОСТОЯНИЕ ──────────────────────────────────
        let authToken = localStorage.getItem('gdz_token') || '';
        let authUser = null;
        let isGuest = localStorage.getItem('gdz_guest') === '1';

        // ─── ЭЛЕМЕНТЫ ───────────────────────────────────
        const $ = id => document.getElementById(id);
        const btn = $('btn'), status = $('status'), result = $('result');
        const welcomeModal = $('welcomeModal');
        const authModal = $('authModal');
        const historyModal = $('historyModal');
        const supportModal = $('supportModal');
        const imageModal = $('imageModal');
        const imageModalImg = $('imageModalImg');
        const topbarRight = $('topbarRight');

        // ─── DEVICE INFO ────────────────────────────────
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let device = 'Unknown';
            if (/mobile/i.test(ua)) device = '📱 Телефон';
            else if (/tablet|ipad/i.test(ua)) device = '📱 Планшет';
            else device = '💻 Компьютер';

            let browser = 'Unknown';
            if (/chrome/i.test(ua) && !/edg/i.test(ua)) browser = 'Chrome';
            else if (/edg/i.test(ua)) browser = 'Edge';
            else if (/firefox/i.test(ua)) browser = 'Firefox';
            else if (/safari/i.test(ua)) browser = 'Safari';
            else if (/yabrowser/i.test(ua)) browser = 'Yandex';

            let os = 'Unknown';
            if (/windows/i.test(ua)) os = 'Windows';
            else if (/mac/i.test(ua)) os = 'macOS';
            else if (/linux/i.test(ua)) os = 'Linux';
            else if (/android/i.test(ua)) os = 'Android';
            else if (/iphone|ipad|ios/i.test(ua)) os = 'iOS';

            const scr = `${window.screen.width}×${window.screen.height}`;
            const lang = navigator.language || 'unknown';
            return `${device} · ${os} · ${browser} · ${scr} · ${lang}`;
        }

        // ─── СТАРТ ──────────────────────────────────────
        async function init() {
            if (authToken) {
                try {
                    const r = await fetch('/api/auth/me?token=' + encodeURIComponent(authToken));
                    if (r.ok) {
                        const d = await r.json();
                        authUser = d.user;
                    } else {
                        authToken = '';
                        localStorage.removeItem('gdz_token');
                    }
                } catch {}
            }
            if (!authToken && !isGuest) {
                welcomeModal.classList.remove('hidden');
            } else {
                renderTopbar();
            }
        }

        function renderTopbar() {
            topbarRight.innerHTML = '';

            if (authUser) {
                const name = authUser.name || authUser.email.split('@')[0];
                const greet = document.createElement('span');
                greet.className = 'topbar-user';
                greet.textContent = '👤 ' + name;
                topbarRight.appendChild(greet);

                // История
                const histBtn = document.createElement('button');
                histBtn.className = 'icon-btn';
                histBtn.title = 'История поисков';
                histBtn.textContent = '📜';
                histBtn.onclick = openHistory;
                topbarRight.appendChild(histBtn);

                // Админ — кнопка сообщений
                if (authUser.is_admin) {
                    const adminBtn = document.createElement('button');
                    adminBtn.className = 'icon-btn admin-icon';
                    adminBtn.title = 'Админка';
                    adminBtn.textContent = '💬';
                    adminBtn.onclick = () => window.location.href = '/admin';
                    topbarRight.appendChild(adminBtn);
                }

                // Выход
                const outBtn = document.createElement('button');
                outBtn.className = 'icon-btn';
                outBtn.title = 'Выйти';
                outBtn.textContent = '🚪';
                outBtn.onclick = logout;
                topbarRight.appendChild(outBtn);
            } else {
                const guestLabel = document.createElement('span');
                guestLabel.className = 'topbar-user';
                guestLabel.textContent = '👤 Гость';
                topbarRight.appendChild(guestLabel);

                const loginBtn = document.createElement('button');
                loginBtn.className = 'icon-btn';
                loginBtn.title = 'Войти';
                loginBtn.textContent = '🔑';
                loginBtn.onclick = openAuth;
                topbarRight.appendChild(loginBtn);
            }

            // Поддержка — всегда
            const supBtn = document.createElement('button');
            supBtn.className = 'icon-btn';
            supBtn.title = 'Техподдержка';
            supBtn.textContent = '❓';
            supBtn.onclick = () => supportModal.classList.remove('hidden');
            topbarRight.appendChild(supBtn);
        }

        // ─── ПРИВЕТСТВИЕ ────────────────────────────────
        $('guestBtn').onclick = () => {
            isGuest = true;
            localStorage.setItem('gdz_guest', '1');
            welcomeModal.classList.add('hidden');
            renderTopbar();
        };

        $('authBtn').onclick = () => {
            welcomeModal.classList.add('hidden');
            openAuth();
        };

        // ─── ВХОД / РЕГИСТРАЦИЯ ────────────────────────
        let authMode = 'login';

        function openAuth() {
            authModal.classList.remove('hidden');
            authMode = 'login';
            switchTab('login');
        }

        function switchTab(mode) {
            authMode = mode;
            document.querySelectorAll('.auth-tab').forEach(t => {
                t.classList.toggle('active', t.dataset.tab === mode);
            });
            $('authTitle').textContent = mode === 'login' ? 'Вход' : 'Регистрация';
            $('authSubmit').textContent = mode === 'login' ? 'Войти' : 'Создать аккаунт';
            $('nameField').style.display = mode === 'register' ? 'block' : 'none';
        }

        document.querySelectorAll('.auth-tab').forEach(t => {
            t.onclick = () => switchTab(t.dataset.tab);
        });

        $('authCancel').onclick = () => {
            authModal.classList.add('hidden');
            if (!authToken && !isGuest) welcomeModal.classList.remove('hidden');
        };

        $('authForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = $('authEmail').value.trim();
            const password = $('authPwd').value;
            const name = $('authName').value.trim();
            const st = $('authStatus');
            const device = getDeviceInfo();

            st.textContent = '⏳ Подождите...';
            st.className = 'fb-status loading';

            const url = authMode === 'login' ? '/api/auth/login' : '/api/auth/register';
            const body = authMode === 'login'
                ? {email, password, device}
                : {email, password, name, device};

            try {
                const r = await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(body)
                });
                const d = await r.json();
                if (!r.ok) {
                    st.textContent = '❌ ' + (d.detail || 'Ошибка');
                    st.className = 'fb-status error';
                    return;
                }
                authToken = d.token;
                authUser = d.user;
                localStorage.setItem('gdz_token', authToken);
                localStorage.removeItem('gdz_guest');
                isGuest = false;
                authModal.classList.add('hidden');
                renderTopbar();
            } catch (err) {
                st.textContent = '❌ ' + err.message;
                st.className = 'fb-status error';
            }
        };

        async function logout() {
            if (!confirm('Выйти из аккаунта?')) return;
            try {
                await fetch('/api/auth/logout', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({token: authToken})
                });
            } catch {}
            authToken = '';
            authUser = null;
            isGuest = false;
            localStorage.removeItem('gdz_token');
            localStorage.removeItem('gdz_guest');
            topbarRight.innerHTML = '';
            welcomeModal.classList.remove('hidden');
        }

        // ─── ИСТОРИЯ ────────────────────────────────────
        async function openHistory() {
            historyModal.classList.remove('hidden');
            const list = $('historyList');
            list.innerHTML = '<p class="empty">Загрузка...</p>';
            try {
                const r = await fetch('/api/history/list?token=' + encodeURIComponent(authToken));
                const d = await r.json();
                if (!r.ok) throw new Error(d.detail || 'Ошибка');
                if (!d.items.length) {
                    list.innerHTML = '<p class="empty">История пуста</p>';
                    return;
                }
                list.innerHTML = '';
                d.items.forEach(it => {
                    const row = document.createElement('div');
                    row.className = 'history-row';
                    row.innerHTML = `
                        <div class="history-info">
                            <strong>${escapeHtml(it.subject)}</strong>
                            <span>${escapeHtml(it.numbers)}</span>
                        </div>
                        <span class="history-date">${escapeHtml(it.created)}</span>
                    `;
                    row.onclick = () => {
                        const input = document.getElementById(
                            it.subject === 'Алгебра' ? 'algebra'
                            : it.subject === 'Русский язык' ? 'russian'
                            : 'geometry'
                        );
                        if (input) {
                            input.value = it.numbers;
                            historyModal.classList.add('hidden');
                        }
                    };
                    list.appendChild(row);
                });
            } catch (e) {
                list.innerHTML = '<p class="empty">Ошибка: ' + e.message + '</p>';
            }
        }

        $('closeHistoryBtn').onclick = () => historyModal.classList.add('hidden');

        $('clearHistoryBtn').onclick = async () => {
            if (!confirm('Очистить всю историю?')) return;
            try {
                await fetch('/api/history/clear', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({token: authToken})
                });
                $('historyList').innerHTML = '<p class="empty">История пуста</p>';
            } catch {}
        };

        // ─── ТЕХПОДДЕРЖКА ───────────────────────────────
        $('closeSupport').onclick = () => supportModal.classList.add('hidden');
        supportModal.onclick = (e) => {
            if (e.target === supportModal) supportModal.classList.add('hidden');
        };

        $('feedbackForm').onsubmit = async (e) => {
            e.preventDefault();
            const msg = $('fbMessage').value.trim();
            if (!msg) return;
            const st = $('fbStatus');
            st.textContent = '⏳ Отправляем...';
            st.className = 'fb-status loading';
            try {
                const r = await fetch('/api/feedback', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        message: msg,
                        contact: $('fbContact').value.trim()
                    })
                });
                if (!r.ok) throw new Error('Ошибка');
                st.textContent = '✅ Отправлено! Спасибо.';
                st.className = 'fb-status success';
                $('fbMessage').value = '';
                $('fbContact').value = '';
                setTimeout(() => supportModal.classList.add('hidden'), 2000);
            } catch (err) {
                st.textContent = '❌ ' + err.message;
                st.className = 'fb-status error';
            }
        };

        // ─── МОДАЛКА КАРТИНКИ ───────────────────────────
        function openImageModal(src) {
            imageModalImg.src = src;
            imageModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        function closeModal() {
            imageModal.classList.add('hidden');
            imageModalImg.src = '';
            document.body.style.overflow = '';
        }
        $('closeImageModal').onclick = closeModal;
        imageModal.onclick = (e) => { if (e.target === imageModal) closeModal(); };
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

        // ─── ЗАГРУЗКА КАРТИНОК ─────────────────────────
        let activeLoads = 0;
        const MAX_PARALLEL = 3;
        const pendingQueue = [];
        const PLACEHOLDER_RETRIES = 4;
        const RETRY_DELAYS = [500, 1000, 2000, 3000];
        const MIN_REAL_WIDTH = 200;
        const MIN_REAL_HEIGHT = 150;
        const LOAD_TIMEOUT = 15000;
        const TALL_RATIO = 3.0;

        function scheduleLoad(fn) {
            return new Promise((resolve) => {
                pendingQueue.push({ fn, resolve });
                processQueue();
            });
        }

        function processQueue() {
            while (activeLoads < MAX_PARALLEL && pendingQueue.length > 0) {
                const { fn, resolve } = pendingQueue.shift();
                activeLoads++;
                fn().then(resolve).finally(() => {
                    activeLoads--;
                    processQueue();
                });
            }
        }

        function showImageError(img, imgUrl) {
            const err = document.createElement('div');
            err.className = 'img-error';
            err.innerHTML = `⚠️ Не удалось получить решение<br><br>
                <a href="${imgUrl}" target="_blank" class="img-error-link">Открыть напрямую с gdz.ru →</a>`;
            img.replaceWith(err);
        }

        function loadImage(img, imgUrl) {
            scheduleLoad(() => new Promise((resolve) => {
                let attempt = 0;

                function tryOnce() {
                    let tid = null;
                    img.classList.remove('img-retrying', 'img-tall');
                    img.classList.add('img-loading');
                    img.alt = 'Загрузка...';
                    tid = setTimeout(() => onFail('Timeout'), LOAD_TIMEOUT);

                    function cleanup() {
                        if (tid) { clearTimeout(tid); tid = null; }
                        img.removeEventListener('load', onLoad);
                        img.removeEventListener('error', onError);
                    }

                    function onLoad() {
                        cleanup();
                        const w = img.naturalWidth, h = img.naturalHeight;
                        if (w < MIN_REAL_WIDTH || h < MIN_REAL_HEIGHT) {
                            attempt++;
                            if (attempt <= PLACEHOLDER_RETRIES) {
                                const delay = RETRY_DELAYS[attempt - 1] || 3000;
                                img.classList.remove('img-loading');
                                img.classList.add('img-retrying');
                                setTimeout(tryOnce, delay);
                                return;
                            }
                            showImageError(img, imgUrl);
                            resolve();
                            return;
                        }
                        img.classList.remove('img-loading', 'img-retrying');
                        if (h / w >= TALL_RATIO) img.classList.add('img-tall');
                        img.onclick = () => openImageModal(img.src);
                        resolve();
                    }

                    function onError() {
                        cleanup();
                        onFail('Error');
                    }

                    img.addEventListener('load', onLoad, { once: true });
                    img.addEventListener('error', onError, { once: true });
                    img.src = '/api/image?url=' + encodeURIComponent(imgUrl)
                        + '&w=1000&t=' + Date.now();
                }

                function onFail(reason) {
                    attempt++;
                    if (attempt <= PLACEHOLDER_RETRIES) {
                        const delay = RETRY_DELAYS[attempt - 1] || 3000;
                        img.classList.remove('img-loading');
                        img.classList.add('img-retrying');
                        setTimeout(tryOnce, delay);
                        return;
                    }
                    showImageError(img, imgUrl);
                    resolve();
                }

                tryOnce();
            }));
        }

        // ─── ПОИСК ──────────────────────────────────────
        btn.addEventListener('click', async () => {
            const jobs = [];
            SUBJECTS.forEach(s => {
                const v = document.getElementById(s.id).value.trim();
                if (v) jobs.push({ subject: s.subject, url: s.url, numbers: v });
            });
            if (!jobs.length) return showStatus('⚠️ Введи номера хотя бы в одном поле', 'error');

            btn.disabled = true;
            result.innerHTML = '';
            let seconds = 0;
            showStatus('⏳ Ищу решения... 0 сек', 'loading');
            const timer = setInterval(() => {
                seconds++;
                showStatus(`⏳ Ищу решения... ${seconds} сек`, 'loading');
            }, 1000);

            try {
                const resp = await fetch('/api/parse', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({jobs})
                });
                const data = await resp.json();
                clearInterval(timer);

                if (!resp.ok) return showStatus('❌ ' + (data.detail || 'Ошибка'), 'error');
                if (data.total === 0) return showStatus('🤷 Ничего не найдено', 'error');

                const found = data.results.filter(r => r.found).length;
                showStatus(`✅ Найдено ${found} из ${data.total} за ${seconds} сек`,
                    found > 0 ? 'success' : 'error');

                // Сохраняем историю (только авторизованным)
                if (authToken) {
                    for (const j of jobs) {
                        fetch('/api/history/save', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                token: authToken,
                                subject: j.subject,
                                numbers: j.numbers
                            })
                        }).catch(() => {});
                    }
                }

                const bySubject = {};
                data.results.forEach(r => {
                    (bySubject[r.subject] = bySubject[r.subject] || []).push(r);
                });

                Object.entries(bySubject).forEach(([subject, items]) => {
                    const sec = document.createElement('section');
                    sec.className = 'subject-block';
                    sec.innerHTML = `<h2>${subject}</h2>`;
                    items.forEach(r => {
                        const card = document.createElement('div');
                        card.className = 'task-card' + (r.found ? '' : ' not-found');
                        card.innerHTML = `<div class="task-header">
                            <h3>№${r.number}</h3>
                            ${r.found ? '' : '<span class="badge">не найдено</span>'}
                        </div>`;
                        if (r.found) {
                            r.images.forEach(u => {
                                const img = document.createElement('img');
                                img.className = 'solution-img img-loading';
                                img.alt = 'Загрузка...';
                                loadImage(img, u);
                                card.appendChild(img);
                            });
                        }
                        sec.appendChild(card);
                    });
                    result.appendChild(sec);
                });
            } catch (err) {
                clearInterval(timer);
                showStatus('❌ Ошибка: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
            }
        });

        function showStatus(text, type) {
            status.textContent = text;
            status.className = 'status ' + type;
        }

        function escapeHtml(t) {
            const d = document.createElement('div');
            d.textContent = t || '';
            return d.innerHTML;
        }

        init();
    </script>
</body>
</html>
