<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDZ Парсер — 7 класс</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>📚 GDZ Парсер</h1>
        <p class="subtitle">7 класс · Введи номера заданий</p>

        <section class="card">
            <h2>📝 Домашка</h2>

            <div class="input-row">
                <label class="input-label">📐 Алгебра <span class="hint">(Макарычев)</span></label>
                <input type="text" class="num-input" id="algebra"
                    placeholder="447, 449, 451(а,в,д), 455, 459">
            </div>

            <div class="input-row">
                <label class="input-label">📖 Русский язык <span class="hint">(Баранов)</span></label>
                <input type="text" class="num-input" id="russian"
                    placeholder="1, 5, 10 или стр. 8, 12">
            </div>

            <button id="btn" class="btn-primary">🔍 Найти решения</button>
        </section>

        <div id="status" class="status"></div>
        <div id="result" class="result"></div>
    </div>

    <script>
        // Предметы "зашиты" в приложение
        const SUBJECTS = [
            {
                id: 'algebra',
                subject: 'Алгебра',
                url: 'https://gdz.ru/class-7/algebra/makarichev-18/',
            },
            {
                id: 'russian',
                subject: 'Русский язык',
                url: 'https://gdz.ru/class-7/russkii_yazik/baranova/',
            },
        ];

        const btn = document.getElementById('btn');
        const status = document.getElementById('status');
        const result = document.getElementById('result');

        btn.addEventListener('click', async () => {
            // Собираем задачи только из заполненных полей
            const jobs = [];
            SUBJECTS.forEach(s => {
                const input = document.getElementById(s.id);
                const numbers = input.value.trim();
                if (numbers) {
                    jobs.push({
                        subject: s.subject,
                        url: s.url,
                        numbers: numbers,
                    });
                }
            });

            if (jobs.length === 0) {
                return showStatus('⚠️ Введи номера хотя бы в одном поле', 'error');
            }

            btn.disabled = true;
            showStatus('⏳ Ищу решения... Это займёт 10–60 секунд', 'loading');
            result.innerHTML = '';

            try {
                const resp = await fetch('/api/parse', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({jobs})
                });
                const data = await resp.json();

                if (!resp.ok) {
                    return showStatus('❌ ' + (data.detail || 'Ошибка'), 'error');
                }
                if (data.total === 0) {
                    return showStatus('🤷 Ничего не найдено', 'error');
                }

                const found = data.results.filter(r => r.found).length;
                showStatus(
                    `✅ Найдено ${found} из ${data.total}`,
                    found > 0 ? 'success' : 'error'
                );

                // Группируем по предмету
                const bySubject = {};
                data.results.forEach(r => {
                    (bySubject[r.subject] = bySubject[r.subject] || []).push(r);
                });

                Object.entries(bySubject).forEach(([subject, items]) => {
                    const sec = document.createElement('section');
                    sec.className = 'subject-block';
                    sec.innerHTML = `<h2>${subject}</h2>`;
                    items.forEach(r => {
                        const card = document.createElement('div');
                        card.className = 'task-card' + (r.found ? '' : ' not-found');
                        card.innerHTML = `<div class="task-header">
                            <h3>№${r.number}</h3>
                            ${r.found ? '' : '<span class="badge">не найдено</span>'}
                        </div>`;
                        if (r.found) {
                            r.images.forEach(imgUrl => {
                                const img = document.createElement('img');
                                img.src = '/api/image?url=' + encodeURIComponent(imgUrl);
                                img.loading = 'lazy';
                                img.className = 'solution-img';
                                img.addEventListener('click',
                                    () => window.open(img.src, '_blank'));
                                card.appendChild(img);
                            });
                        }
                        sec.appendChild(card);
                    });
                    result.appendChild(sec);
                });
            } catch (err) {
                showStatus('❌ Ошибка: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
            }
        });

        function showStatus(text, type) {
            status.textContent = text;
            status.className = 'status ' + type;
        }
    </script>
</body>
</html>
