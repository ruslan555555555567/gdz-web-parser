<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDZ Парсер — 7 класс</title>
    <script>
        (function() {
            try {
                const theme = localStorage.getItem('gdz_theme') || 'light';
                const bg = localStorage.getItem('gdz_bg');
                const root = document.documentElement;
                if (theme === 'dark') {
                    root.classList.add('theme-dark');
                } else if (theme === 'custom' && bg) {
                    root.classList.add('theme-custom');
                    root.style.backgroundImage = 'url("' + bg + '")';
                }
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- ═══════ ЭКРАН ВХОДА ═══════ -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-screen-box">
            <div class="auth-logo">📚</div>
            <h1 class="auth-screen-title">GDZ Парсер</h1>
            <p class="auth-screen-subtitle">Войди или зарегистрируйся, чтобы начать</p>

            <div class="auth-tabs">
                <button type="button" class="auth-tab active" data-tab="login">Вход</button>
                <button type="button" class="auth-tab" data-tab="register">Регистрация</button>
            </div>

            <form id="authForm">
                <label class="form-label" id="nameField" style="display:none;">
                    Имя
                    <input type="text" id="authName" placeholder="Как тебя зовут">
                </label>
                <label class="form-label">
                    Email
                    <input type="email" id="authEmail" placeholder="you@example.com" required>
                </label>
                <label class="form-label">
                    Пароль
                    <input type="password" id="authPwd" placeholder="минимум 6 символов" required>
                </label>
                <div id="authStatus" class="fb-status"></div>
                <button type="submit" id="authSubmit" class="btn-primary">Войти</button>
            </form>
        </div>
    </div>

    <!-- ═══════ ГЛАВНЫЙ ЭКРАН ═══════ -->
    <div id="mainScreen" class="container hidden">
        <div class="topbar">
            <span class="version">v{{ version }}</span>
            <div class="topbar-right" id="topbarRight"></div>
        </div>

        <h1>📚 GDZ Парсер</h1>
        <p class="subtitle">7 класс · Введи номера заданий</p>

        <section class="card">
            <h2>📝 Домашка</h2>
            <div id="subjectsContainer">
                <p class="empty">Загрузка предметов...</p>
            </div>
            <button id="btn" class="btn-primary">🔍 Найти решения</button>
        </section>

        <div id="status" class="status"></div>
        <div id="result" class="result"></div>

        <footer class="footer">
            <span>GDZ Парсер · v{{ version }}</span>
        </footer>
    </div>

    <!-- ИСТОРИЯ -->
    <div id="historyModal" class="modal hidden">
        <div class="modal-content">
            <h3>📜 История поисков</h3>
            <div id="historyList"></div>
            <div class="modal-actions">
                <button id="clearHistoryBtn" class="btn-secondary">🗑 Очистить</button>
                <button id="closeHistoryBtn" class="btn-primary">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- НАСТРОЙКИ -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-content">
            <h3>⚙️ Настройки аккаунта</h3>

            <div class="settings-section">
                <label class="form-label">
                    Имя
                    <input type="text" id="setName" placeholder="Как тебя зовут">
                </label>
            </div>

            <div class="settings-section">
                <label class="form-label">Оформление</label>
                <div class="theme-options">
                    <button type="button" class="theme-btn active" data-theme="light">
                        <span class="theme-preview light-preview"></span>
                        ☀️ Светлая
                    </button>
                    <button type="button" class="theme-btn" data-theme="dark">
                        <span class="theme-preview dark-preview"></span>
                        🌙 Тёмная
                    </button>
                    <button type="button" class="theme-btn" data-theme="custom">
                        <span class="theme-preview custom-preview">🖼</span>
                        🎨 Своя картинка
                    </button>
                </div>
                <div id="customBgBlock" style="display:none; margin-top:12px;">
                    <label class="form-label">
                        URL картинки для фона
                        <input type="text" id="setBgUrl" placeholder="https://example.com/image.jpg">
                    </label>
                </div>
            </div>

            <div class="settings-section" id="passwordSection">
                <label class="form-label">Смена пароля</label>
                <input type="password" id="setOldPwd" class="num-input"
                    placeholder="Текущий пароль" style="margin-bottom:8px;">
                <input type="password" id="setNewPwd" class="num-input"
                    placeholder="Новый пароль (мин. 6 символов)">
            </div>

            <div class="settings-section" id="logoutSection">
                <label class="form-label">Сессия</label>
                <button type="button" id="logoutBtn" class="btn-logout">🚪 Выйти из аккаунта</button>
            </div>

            <div id="settingsStatus" class="fb-status"></div>

            <div class="modal-actions" style="justify-content:space-between;">
                <button type="button" id="deleteAccountBtn" class="btn-danger">🗑 Удалить аккаунт</button>
                <div style="display:flex; gap:10px;">
                    <button type="button" id="closeSettingsBtn" class="btn-secondary">Отмена</button>
                    <button type="button" id="saveSettingsBtn" class="btn-primary" style="width:auto;">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ТЕХПОДДЕРЖКА -->
    <div id="supportModal" class="modal hidden">
        <div class="modal-content">
            <h3>💬 Техподдержка</h3>
            <p class="modal-text">Нашли ошибку или есть вопрос? Напишите — мы ответим.</p>
            <form id="feedbackForm">
                <label class="form-label">
                    Сообщение <span class="required">*</span>
                    <textarea id="fbMessage" rows="4" placeholder="Опишите проблему..."></textarea>
                </label>
                <label class="form-label">
                    Контакт <span class="hint">(необязательно)</span>
                    <input type="text" id="fbContact" placeholder="Telegram, email">
                </label>
                <div id="fbStatus" class="fb-status"></div>
                <div class="modal-actions">
                    <button type="button" id="closeSupport" class="btn-secondary">Отмена</button>
                    <button type="submit" id="fbSubmit" class="btn-primary">Отправить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- КАРТИНКА -->
    <div id="imageModal" class="modal hidden">
        <div class="image-modal-content">
            <button id="closeImageModal" class="image-modal-close">✕</button>
            <img id="imageModalImg" src="" alt="">
        </div>
    </div>

    <script>
        let authToken = localStorage.getItem('gdz_token') || '';
        let authUser = null;
        let currentTheme = localStorage.getItem('gdz_theme') || 'light';
        let currentBgUrl = localStorage.getItem('gdz_bg') || null;
        let SUBJECTS = [];

        const $ = id => document.getElementById(id);
        const authScreen = $('authScreen');
        const mainScreen = $('mainScreen');
        const btn = $('btn'), status = $('status'), result = $('result');
        const historyModal = $('historyModal');
        const settingsModal = $('settingsModal');
        const supportModal = $('supportModal');
        const imageModal = $('imageModal');
        const imageModalImg = $('imageModalImg');
        const topbarRight = $('topbarRight');

        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let device = '💻 Компьютер';
            if (/mobile/i.test(ua)) device = '📱 Телефон';
            else if (/tablet|ipad/i.test(ua)) device = '📱 Планшет';
            let browser = 'Unknown';
            if (/chrome/i.test(ua) && !/edg/i.test(ua)) browser = 'Chrome';
            else if (/edg/i.test(ua)) browser = 'Edge';
            else if (/firefox/i.test(ua)) browser = 'Firefox';
            else if (/safari/i.test(ua)) browser = 'Safari';
            else if (/yabrowser/i.test(ua)) browser = 'Yandex';
            let os = 'Unknown';
            if (/windows/i.test(ua)) os = 'Windows';
            else if (/mac/i.test(ua)) os = 'macOS';
            else if (/linux/i.test(ua)) os = 'Linux';
            else if (/android/i.test(ua)) os = 'Android';
            else if (/iphone|ipad|ios/i.test(ua)) os = 'iOS';
            const scr = `${window.screen.width}×${window.screen.height}`;
            const lang = navigator.language || 'unknown';
            return `${device} · ${os} · ${browser} · ${scr} · ${lang}`;
        }

        function applyTheme(theme, bgUrl) {
            currentTheme = theme;
            currentBgUrl = bgUrl;
            const root = document.documentElement;
            root.classList.remove('theme-dark', 'theme-custom');
            root.style.backgroundImage = '';
            if (theme === 'dark') {
                root.classList.add('theme-dark');
                localStorage.setItem('gdz_theme', 'dark');
                localStorage.removeItem('gdz_bg');
            } else if (theme === 'custom' && bgUrl) {
                root.classList.add('theme-custom');
                root.style.backgroundImage = 'url("' + bgUrl + '")';
                localStorage.setItem('gdz_theme', 'custom');
                localStorage.setItem('gdz_bg', bgUrl);
            } else {
                localStorage.setItem('gdz_theme', 'light');
                localStorage.removeItem('gdz_bg');
            }
        }

        async function init() {
            if (authToken) {
                try {
                    const r = await fetch('/api/auth/me?token=' + encodeURIComponent(authToken));
                    if (r.ok) {
                        const d = await r.json();
                        authUser = d.user;
                        applyTheme(authUser.theme || 'light', authUser.bg_url);
                        showMain();
                        return;
                    } else {
                        authToken = '';
                        localStorage.removeItem('gdz_token');
                    }
                } catch {}
            }
            showAuth();
        }

        function showAuth() {
            authScreen.classList.remove('hidden');
            mainScreen.classList.add('hidden');
        }

        async function showMain() {
            authScreen.classList.add('hidden');
            mainScreen.classList.remove('hidden');
            renderTopbar();
            await loadSubjects();
        }

        // ─── ЗАГРУЗКА ПРЕДМЕТОВ ────────────────────────
        async function loadSubjects() {
            try {
                const r = await fetch('/api/subjects');
                const d = await r.json();
                SUBJECTS = d.subjects || [];
                renderSubjects();
            } catch (e) {
                $('subjectsContainer').innerHTML =
                    '<p class="empty">Не удалось загрузить предметы</p>';
            }
        }

        function renderSubjects() {
            const container = $('subjectsContainer');
            container.innerHTML = '';

            // Группируем по group_name
            const groups = {};
            SUBJECTS.forEach(s => {
                const g = s.group_name || 'Прочее';
                if (!groups[g]) groups[g] = [];
                groups[g].push(s);
            });

            Object.entries(groups).forEach(([groupName, items]) => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'subject-group';

                const title = document.createElement('h3');
                title.className = 'group-title';
                title.textContent = groupName;
                groupDiv.appendChild(title);

                // Подсказка для текстовой группы
                const hasText = items.some(s => s.type === 'text');
                if (hasText) {
                    const hint = document.createElement('p');
                    hint.className = 'group-hint';
                    hint.textContent = 'Задания из этих предметов можно вставлять текстом.';
                    groupDiv.appendChild(hint);
                }

                items.forEach(s => {
                    const row = document.createElement('div');
                    row.className = 'input-row';

                    const label = document.createElement('label');
                    label.className = 'input-label';
                    label.textContent = s.name;
                    row.appendChild(label);

                    const inputId = 'subj_' + s.id;

                    if (s.type === 'text') {
                        const ta = document.createElement('textarea');
                        ta.className = 'text-input';
                        ta.id = inputId;
                        ta.rows = 2;
                        ta.placeholder = 'Вставь текст задания...';
                        ta.dataset.subject = s.name;
                        ta.dataset.type = 'text';
                        ta.dataset.url = s.url || '';
                        row.appendChild(ta);
                    } else {
                        const inp = document.createElement('input');
                        inp.type = 'text';
                        inp.className = 'num-input';
                        inp.id = inputId;
                        inp.placeholder = '1, 5, 10';
                        inp.dataset.subject = s.name;
                        inp.dataset.type = 'numbers';
                        inp.dataset.url = s.url || '';
                        row.appendChild(inp);
                    }

                    groupDiv.appendChild(row);
                });

                container.appendChild(groupDiv);
            });
        }

        // ─── ВЕРХНЯЯ ПАНЕЛЬ ────────────────────────────
        function renderTopbar() {
            topbarRight.innerHTML = '';
            const name = authUser.name || authUser.email.split('@')[0];
            const greet = document.createElement('span');
            greet.className = 'topbar-user';
            greet.textContent = '👤 ' + name;
            topbarRight.appendChild(greet);

            const histBtn = document.createElement('button');
            histBtn.className = 'icon-btn';
            histBtn.title = 'История';
            histBtn.textContent = '📜';
            histBtn.onclick = openHistory;
            topbarRight.appendChild(histBtn);

            const setBtn = document.createElement('button');
            setBtn.className = 'icon-btn';
            setBtn.title = 'Настройки';
            setBtn.textContent = '⚙️';
            setBtn.onclick = openSettings;
            topbarRight.appendChild(setBtn);

            if (authUser.is_admin) {
                const adminBtn = document.createElement('button');
                adminBtn.className = 'icon-btn admin-icon';
                adminBtn.title = 'Админка';
                adminBtn.textContent = '💬';
                adminBtn.onclick = () => window.location.href = '/admin';
                topbarRight.appendChild(adminBtn);
            }

            const supBtn = document.createElement('button');
            supBtn.className = 'icon-btn';
            supBtn.title = 'Техподдержка';
            supBtn.textContent = '❓';
            supBtn.onclick = () => supportModal.classList.remove('hidden');
            topbarRight.appendChild(supBtn);
        }

        // ─── ВХОД ──────────────────────────────────────
        let authMode = 'login';

        function switchTab(mode) {
            authMode = mode;
            document.querySelectorAll('.auth-tab').forEach(t => {
                t.classList.toggle('active', t.dataset.tab === mode);
            });
            $('nameField').style.display = mode === 'register' ? 'block' : 'none';
            $('authSubmit').textContent = mode === 'login' ? 'Войти' : 'Создать аккаунт';
        }

        document.querySelectorAll('.auth-tab').forEach(t => {
            t.onclick = () => switchTab(t.dataset.tab);
        });

        $('authForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = $('authEmail').value.trim();
            const password = $('authPwd').value;
            const name = $('authName').value.trim();
            const st = $('authStatus');
            const device = getDeviceInfo();

            st.textContent = '⏳ Подождите...';
            st.className = 'fb-status loading';

            const url = authMode === 'login' ? '/api/auth/login' : '/api/auth/register';
            const body = authMode === 'login' ? {email, password, device} : {email, password, name, device};

            try {
                const r = await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(body)
                });
                const d = await r.json();
                if (!r.ok) {
                    st.textContent = '❌ ' + (d.detail || 'Ошибка');
                    st.className = 'fb-status error';
                    return;
                }
                authToken = d.token;
                authUser = d.user;
                localStorage.setItem('gdz_token', authToken);
                applyTheme(authUser.theme || 'light', authUser.bg_url);
                showMain();
            } catch (err) {
                st.textContent = '❌ ' + err.message;
                st.className = 'fb-status error';
            }
        };

        async function logout() {
            if (!confirm('Выйти из аккаунта?')) return;
            try {
                await fetch('/api/auth/logout', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({token: authToken})
                });
            } catch {}
            authToken = '';
            authUser = null;
            localStorage.removeItem('gdz_token');
            applyTheme('light', null);
            topbarRight.innerHTML = '';
            showAuth();
        }

        // ─── ИСТОРИЯ ───────────────────────────────────
        async function openHistory() {
            historyModal.classList.remove('hidden');
            const list = $('historyList');
            list.innerHTML = '<p class="empty">Загрузка...</p>';
            try {
                const r = await fetch('/api/history/list?token=' + encodeURIComponent(authToken));
                const d = await r.json();
                if (!r.ok) throw new Error(d.detail || 'Ошибка');
                if (!d.items.length) {
                    list.innerHTML = '<p class="empty">История пуста</p>';
                    return;
                }
                list.innerHTML = '';
                d.items.forEach(it => {
                    const row = document.createElement('div');
                    row.className = 'history-row';
                    row.innerHTML = `
                        <div class="history-info">
                            <strong>${escapeHtml(it.subject)}</strong>
                            <span>${escapeHtml(it.numbers)}</span>
                        </div>
                        <span class="history-date">${escapeHtml(it.created)}</span>
                    `;
                    row.onclick = () => {
                        const subj = SUBJECTS.find(s => s.name === it.subject);
                        if (subj) {
                            const el = document.getElementById('subj_' + subj.id);
                            if (el) el.value = it.numbers;
                            historyModal.classList.add('hidden');
                        }
                    };
                    list.appendChild(row);
                });
            } catch (e) {
                list.innerHTML = '<p class="empty">Ошибка: ' + e.message + '</p>';
            }
        }

        $('closeHistoryBtn').onclick = () => historyModal.classList.add('hidden');
        $('clearHistoryBtn').onclick = async () => {
            if (!confirm('Очистить всю историю?')) return;
            try {
                await fetch('/api/history/clear', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({token: authToken})
                });
                $('historyList').innerHTML = '<p class="empty">История пуста</p>';
            } catch {}
        };

        // ─── НАСТРОЙКИ ─────────────────────────────────
        function openSettings() {
            settingsModal.classList.remove('hidden');
            $('settingsStatus').textContent = '';
            $('settingsStatus').className = 'fb-status';
            $('setName').value = authUser?.name || '';
            $('setBgUrl').value = currentBgUrl || '';
            $('setOldPwd').value = '';
            $('setNewPwd').value = '';
            document.querySelectorAll('.theme-btn').forEach(t => {
                t.classList.toggle('active', t.dataset.theme === currentTheme);
            });
            $('customBgBlock').style.display = currentTheme === 'custom' ? 'block' : 'none';
        }

        $('closeSettingsBtn').onclick = () => settingsModal.classList.add('hidden');
        settingsModal.onclick = (e) => {
            if (e.target === settingsModal) settingsModal.classList.add('hidden');
        };

        document.querySelectorAll('.theme-btn').forEach(t => {
            t.onclick = () => {
                const theme = t.dataset.theme;
                document.querySelectorAll('.theme-btn').forEach(x =>
                    x.classList.toggle('active', x === t));
                $('customBgBlock').style.display = theme === 'custom' ? 'block' : 'none';
                const bg = theme === 'custom' ? $('setBgUrl').value.trim() : null;
                applyTheme(theme, bg);
            };
        });

        $('setBgUrl').oninput = () => {
            if (currentTheme === 'custom') {
                applyTheme('custom', $('setBgUrl').value.trim());
            }
        };

        $('saveSettingsBtn').onclick = async () => {
            const st = $('settingsStatus');
            const newName = $('setName').value.trim();
            const newTheme = document.querySelector('.theme-btn.active')?.dataset.theme || 'light';
            const newBg = $('setBgUrl').value.trim();
            const oldPwd = $('setOldPwd').value;
            const newPwd = $('setNewPwd').value;

            st.textContent = '⏳ Сохраняем...';
            st.className = 'fb-status loading';

            try {
                const r1 = await fetch('/api/auth/update', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        token: authToken, name: newName,
                        theme: newTheme,
                        bg_url: newTheme === 'custom' ? newBg : ''
                    })
                });
                const d1 = await r1.json();
                if (!r1.ok) {
                    st.textContent = '❌ ' + (d1.detail || 'Ошибка');
                    st.className = 'fb-status error';
                    return;
                }
                authUser = d1.user;
                applyTheme(authUser.theme, authUser.bg_url);
                renderTopbar();

                if (oldPwd && newPwd) {
                    const r2 = await fetch('/api/auth/change-password', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({token: authToken, old_password: oldPwd, new_password: newPwd})
                    });
                    const d2 = await r2.json();
                    if (!r2.ok) {
                        st.textContent = '⚠️ Профиль сохранён, пароль: ' + (d2.detail || 'Ошибка');
                        st.className = 'fb-status error';
                        return;
                    }
                    st.textContent = '✅ Профиль и пароль сохранены';
                } else {
                    st.textContent = '✅ Настройки сохранены';
                }
                st.className = 'fb-status success';
                setTimeout(() => settingsModal.classList.add('hidden'), 1500);
            } catch (e) {
                st.textContent = '❌ ' + e.message;
                st.className = 'fb-status error';
            }
        };

        $('logoutBtn').onclick = () => {
            settingsModal.classList.add('hidden');
            logout();
        };

        $('deleteAccountBtn').onclick = async () => {
            if (!confirm('Удалить аккаунт?')) return;
            if (!confirm('Точно удалить?')) return;
            const st = $('settingsStatus');
            st.textContent = '⏳ Удаляем...';
            st.className = 'fb-status loading';
            try {
                const r = await fetch('/api/auth/delete', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({token: authToken})
                });
                if (!r.ok) throw new Error('Ошибка удаления');
                authToken = '';
                authUser = null;
                localStorage.removeItem('gdz_token');
                localStorage.removeItem('gdz_theme');
                localStorage.removeItem('gdz_bg');
                applyTheme('light', null);
                settingsModal.classList.add('hidden');
                showAuth();
            } catch (e) {
                st.textContent = '❌ ' + e.message;
                st.className = 'fb-status error';
            }
        };

        // ─── ТЕХПОДДЕРЖКА ──────────────────────────────
        $('closeSupport').onclick = () => supportModal.classList.add('hidden');
        supportModal.onclick = (e) => {
            if (e.target === supportModal) supportModal.classList.add('hidden');
        };

        $('feedbackForm').onsubmit = async (e) => {
            e.preventDefault();
            const msg = $('fbMessage').value.trim();
            if (!msg) return;
            const st = $('fbStatus');
            st.textContent = '⏳ Отправляем...';
            st.className = 'fb-status loading';
            try {
                const r = await fetch('/api/feedback', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: msg, contact: $('fbContact').value.trim()})
                });
                if (!r.ok) throw new Error('Ошибка');
                st.textContent = '✅ Отправлено! Спасибо.';
                st.className = 'fb-status success';
                $('fbMessage').value = '';
                $('fbContact').value = '';
                setTimeout(() => supportModal.classList.add('hidden'), 2000);
            } catch (err) {
                st.textContent = '❌ ' + err.message;
                st.className = 'fb-status error';
            }
        };

        // ─── КАРТИНКА ──────────────────────────────────
        function openImageModal(src) {
            imageModalImg.src = src;
            imageModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        function closeModal() {
            imageModal.classList.add('hidden');
            imageModalImg.src = '';
            document.body.style.overflow = '';
        }
        $('closeImageModal').onclick = closeModal;
        imageModal.onclick = (e) => { if (e.target === imageModal) closeModal(); };
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

        // ─── ЗАГРУЗКА КАРТИНОК ─────────────────────────
        let activeLoads = 0;
        const MAX_PARALLEL = 3;
        const pendingQueue = [];
        const PLACEHOLDER_RETRIES = 4;
        const RETRY_DELAYS = [500, 1000, 2000, 3000];
        const MIN_REAL_WIDTH = 200;
        const MIN_REAL_HEIGHT = 150;
        const LOAD_TIMEOUT = 15000;
        const TALL_RATIO = 3.0;

        function scheduleLoad(fn) {
            return new Promise((resolve) => {
                pendingQueue.push({ fn, resolve });
                processQueue();
            });
        }

        function processQueue() {
            while (activeLoads < MAX_PARALLEL && pendingQueue.length > 0) {
                const { fn, resolve } = pendingQueue.shift();
                activeLoads++;
                fn().then(resolve).finally(() => {
                    activeLoads--;
                    processQueue();
                });
            }
        }

        function showImageError(img, imgUrl) {
            const err = document.createElement('div');
            err.className = 'img-error';
            err.innerHTML = `⚠️ Не удалось получить решение<br><br>
                <a href="${imgUrl}" target="_blank" class="img-error-link">Открыть напрямую с gdz.ru →</a>`;
            img.replaceWith(err);
        }

        function loadImage(img, imgUrl) {
            scheduleLoad(() => new Promise((resolve) => {
                let attempt = 0;

                function tryOnce() {
                    let tid = null;
                    img.classList.remove('img-retrying', 'img-tall');
                    img.classList.add('img-loading');
                    img.alt = 'Загрузка...';
                    tid = setTimeout(() => onFail('Timeout'), LOAD_TIMEOUT);

                    function cleanup() {
                        if (tid) { clearTimeout(tid); tid = null; }
                        img.removeEventListener('load', onLoad);
                        img.removeEventListener('error', onError);
                    }

                    function onLoad() {
                        cleanup();
                        const w = img.naturalWidth, h = img.naturalHeight;
                        if (w < MIN_REAL_WIDTH || h < MIN_REAL_HEIGHT) {
                            attempt++;
                            if (attempt <= PLACEHOLDER_RETRIES) {
                                const delay = RETRY_DELAYS[attempt - 1] || 3000;
                                img.classList.remove('img-loading');
                                img.classList.add('img-retrying');
                                setTimeout(tryOnce, delay);
                                return;
                            }
                            showImageError(img, imgUrl);
                            resolve();
                            return;
                        }
                        img.classList.remove('img-loading', 'img-retrying');
                        if (h / w >= TALL_RATIO) img.classList.add('img-tall');
                        img.onclick = () => openImageModal(img.src);
                        resolve();
                    }

                    function onError() { cleanup(); onFail('Error'); }

                    img.addEventListener('load', onLoad, { once: true });
                    img.addEventListener('error', onError, { once: true });
                    img.src = '/api/image?url=' + encodeURIComponent(imgUrl) + '&w=1000&t=' + Date.now();
                }

                function onFail(reason) {
                    attempt++;
                    if (attempt <= PLACEHOLDER_RETRIES) {
                        const delay = RETRY_DELAYS[attempt - 1] || 3000;
                        img.classList.remove('img-loading');
                        img.classList.add('img-retrying');
                        setTimeout(tryOnce, delay);
                        return;
                    }
                    showImageError(img, imgUrl);
                    resolve();
                }

                tryOnce();
            }));
        }

        // ─── ПОИСК ─────────────────────────────────────
        btn.addEventListener('click', async () => {
            const jobs = [];
            SUBJECTS.forEach(s => {
                const el = document.getElementById('subj_' + s.id);
                if (!el) return;
                const v = el.value.trim();
                if (!v) return;
                jobs.push({
                    subject: s.name,
                    url: s.url || '',
                    type: s.type || 'numbers',
                    numbers: s.type === 'numbers' ? v : '',
                    raw_text: v
                });
            });

            if (!jobs.length) return showStatus('⚠️ Заполни хотя бы одно поле', 'error');

            btn.disabled = true;
            result.innerHTML = '';
            let seconds = 0;
            showStatus('⏳ Ищу решения... 0 сек', 'loading');
            const timer = setInterval(() => {
                seconds++;
                showStatus(`⏳ Ищу решения... ${seconds} сек`, 'loading');
            }, 1000);

            try {
                const resp = await fetch('/api/parse', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({jobs})
                });
                const data = await resp.json();
                clearInterval(timer);

                if (!resp.ok) return showStatus('❌ ' + (data.detail || 'Ошибка'), 'error');
                if (data.total === 0) return showStatus('🤷 Ничего не найдено', 'error');

                const found = data.results.filter(r => r.found).length;
                showStatus(`✅ Обработано ${data.total} заданий`, 'success');

                if (authToken) {
                    for (const j of jobs) {
                        if (!j.numbers) continue;
                        fetch('/api/history/save', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({token: authToken, subject: j.subject, numbers: j.numbers})
                        }).catch(() => {});
                    }
                }

                const bySubject = {};
                data.results.forEach(r => {
                    (bySubject[r.subject] = bySubject[r.subject] || []).push(r);
                });

                Object.entries(bySubject).forEach(([subject, items]) => {
                    const sec = document.createElement('section');
                    sec.className = 'subject-block';
                    sec.innerHTML = `<h2>${escapeHtml(subject)}</h2>`;

                    let lastRawText = '';

                    items.forEach(r => {
                        if (r.raw_text) lastRawText = r.raw_text;

                        // Если это текстовый предмет или не найдено — показываем текст
                        if (r.is_text || !r.found) {
                            const textCard = document.createElement('div');
                            textCard.className = 'task-card text-task';
                            let headerText = '📝 Задание';
                            if (r.number) {
                                headerText = `№${r.number} — не найдено`;
                            }
                            textCard.innerHTML = `
                                <div class="task-header">
                                    <h3>${escapeHtml(headerText)}</h3>
                                </div>
                                <div class="task-text">${escapeHtml(r.raw_text || '')}</div>
                            `;
                            sec.appendChild(textCard);
                            return;
                        }

                        // Иначе — картинка
                        const card = document.createElement('div');
                        card.className = 'task-card';
                        card.innerHTML = `<div class="task-header">
                            <h3>№${r.number}</h3>
                        </div>`;
                        r.images.forEach(u => {
                            const img = document.createElement('img');
                            img.className = 'solution-img img-loading';
                            img.alt = 'Загрузка...';
                            loadImage(img, u);
                            card.appendChild(img);
                        });
                        sec.appendChild(card);
                    });

                    result.appendChild(sec);
                });
            } catch (err) {
                clearInterval(timer);
                showStatus('❌ Ошибка: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
            }
        });

        function showStatus(text, type) {
            status.textContent = text;
            status.className = 'status ' + type;
        }

        function escapeHtml(t) {
            const d = document.createElement('div');
            d.textContent = t || '';
            return d.innerHTML;
        }

        init();
    </script>
</body>
</html>
