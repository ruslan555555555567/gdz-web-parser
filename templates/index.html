<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDZ Парсер — 7 класс</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="topbar">
            <span class="version">v{{ version }}</span>
            <button id="supportBtn" class="support-btn" title="Техподдержка">💬</button>
        </div>

        <h1>📚 GDZ Парсер</h1>
        <p class="subtitle">7 класс · Введи номера заданий</p>

        <section class="card">
            <h2>📝 Домашка</h2>

            <div class="input-row">
                <label class="input-label">📐 Алгебра <span class="hint">(Макарычев)</span></label>
                <input type="text" class="num-input" id="algebra"
                    placeholder="447, 449, 451(а,в,д), 455, 459">
            </div>

            <div class="input-row">
                <label class="input-label">📖 Русский язык <span class="hint">(Баранов)</span></label>
                <input type="text" class="num-input" id="russian"
                    placeholder="1, 5, 10 или стр. 8, 12">
            </div>

            <div class="input-row">
                <label class="input-label">📐 Геометрия <span class="hint">(Мерзляк)</span></label>
                <input type="text" class="num-input" id="geometry"
                    placeholder="1, 5, 10, 15">
            </div>

            <button id="btn" class="btn-primary">🔍 Найти решения</button>
        </section>

        <div id="status" class="status"></div>
        <div id="result" class="result"></div>

        <footer class="footer">
            <span>GDZ Парсер · v{{ version }}</span>
        </footer>
    </div>

    <div id="supportModal" class="modal hidden">
        <div class="modal-content">
            <h3>💬 Техподдержка</h3>
            <p class="modal-text">Нашли ошибку или есть вопрос? Напишите — мы ответим.</p>

            <form id="feedbackForm">
                <label class="form-label">
                    Сообщение <span class="required">*</span>
                    <textarea id="fbMessage" rows="4"
                        placeholder="Опишите проблему или вопрос..."></textarea>
                </label>
                <label class="form-label">
                    Контакт для связи <span class="hint">(необязательно)</span>
                    <input type="text" id="fbContact"
                        placeholder="Telegram, email или телефон">
                </label>
                <div id="fbStatus" class="fb-status"></div>
                <div class="modal-actions">
                    <button type="button" id="closeSupport" class="btn-secondary">Отмена</button>
                    <button type="submit" id="fbSubmit" class="btn-primary">Отправить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUBJECTS = [
            { id: 'algebra', subject: 'Алгебра',
              url: 'https://gdz.ru/class-7/algebra/makarichev-18/' },
            { id: 'russian', subject: 'Русский язык',
              url: 'https://gdz.ru/class-7/russkii_yazik/baranova/' },
            { id: 'geometry', subject: 'Геометрия',
              url: 'https://gdz.ru/class-7/geometria/merzljak/' },
        ];

        const btn = document.getElementById('btn');
        const status = document.getElementById('status');
        const result = document.getElementById('result');
        const supportBtn = document.getElementById('supportBtn');
        const supportModal = document.getElementById('supportModal');
        const closeSupport = document.getElementById('closeSupport');
        const feedbackForm = document.getElementById('feedbackForm');
        const fbMessage = document.getElementById('fbMessage');
        const fbContact = document.getElementById('fbContact');
        const fbSubmit = document.getElementById('fbSubmit');
        const fbStatus = document.getElementById('fbStatus');

        // ─── ТЕХПОДДЕРЖКА ────────────────────────────────
        supportBtn.addEventListener('click', () => {
            supportModal.classList.remove('hidden');
            fbStatus.textContent = '';
            fbStatus.className = 'fb-status';
        });
        closeSupport.addEventListener('click', () => supportModal.classList.add('hidden'));
        supportModal.addEventListener('click', (e) => {
            if (e.target === supportModal) supportModal.classList.add('hidden');
        });

        feedbackForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = fbMessage.value.trim();
            if (!message) {
                fbStatus.textContent = '⚠️ Напиши сообщение';
                fbStatus.className = 'fb-status error';
                return;
            }
            fbSubmit.disabled = true;
            fbStatus.textContent = '⏳ Отправляем...';
            fbStatus.className = 'fb-status loading';

            try {
                const resp = await fetch('/api/feedback', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        message: message,
                        contact: fbContact.value.trim(),
                    }),
                });
                const data = await resp.json();
                if (!resp.ok) {
                    fbStatus.textContent = '❌ ' + (data.detail || 'Ошибка');
                    fbStatus.className = 'fb-status error';
                    return;
                }
                fbStatus.textContent = '✅ Отправлено! Спасибо.';
                fbStatus.className = 'fb-status success';
                fbMessage.value = '';
                fbContact.value = '';
                setTimeout(() => supportModal.classList.add('hidden'), 2000);
            } catch (err) {
                fbStatus.textContent = '❌ Ошибка: ' + err.message;
                fbStatus.className = 'fb-status error';
            } finally {
                fbSubmit.disabled = false;
            }
        });

        // ─── ЗАГРУЗКА КАРТИНОК (по 3 параллельно) ───────
        let activeLoads = 0;
        const MAX_PARALLEL = 3;
        const pendingQueue = [];

        // Сколько раз повторять, если пришла заглушка
        const PLACEHOLDER_RETRIES = 4;
        // Пауза между повторами (мс), растёт с каждой попыткой
        const RETRY_DELAYS = [500, 1000, 2000, 3000];
        // Картинка считается заглушкой, если меньше этого размера
        const MIN_REAL_WIDTH = 200;
        const MIN_REAL_HEIGHT = 150;
        // Жёсткий таймаут на одну попытку загрузки (мс)
        const LOAD_TIMEOUT = 15000;

        function scheduleLoad(fn) {
            return new Promise((resolve) => {
                pendingQueue.push({ fn, resolve });
                processQueue();
            });
        }

        function processQueue() {
            while (activeLoads < MAX_PARALLEL && pendingQueue.length > 0) {
                const { fn, resolve } = pendingQueue.shift();
                activeLoads++;
                fn().then(resolve).finally(() => {
                    activeLoads--;
                    processQueue();
                });
            }
        }

        // Отрисовка блока ошибки (когда все попытки исчерпаны)
        function showImageError(img, imgUrl) {
            const err = document.createElement('div');
            err.className = 'img-error';
            err.innerHTML = `
                ⚠️ Не удалось получить решение после ${PLACEHOLDER_RETRIES + 1} попыток<br><br>
                <a href="${imgUrl}" target="_blank" class="img-error-link">
                    Открыть напрямую с gdz.ru →
                </a>
            `;
            img.replaceWith(err);
        }

        // Обновить текст «пробуем снова N/M»
        function showRetryLabel(img, attempt) {
            img.classList.remove('img-loading');
            img.classList.add('img-retrying');
            // Временно ставим текст через псевдоэлемент нельзя,
            // поэтому показываем через title и alt
            img.alt = `⏳ Пробуем снова (${attempt}/${PLACEHOLDER_RETRIES})...`;
        }

        function loadImage(img, imgUrl) {
            scheduleLoad(() => new Promise((resolve) => {
                let placeholderAttempt = 0;

                function tryOnce() {
                    let timeoutId = null;

                    // Сбрасываем предыдущие обработчики
                    img.classList.remove('img-retrying');
                    img.classList.add('img-loading');
                    img.alt = 'Загрузка решения...';

                    // Жёсткий таймаут — если сервер молчит 15 сек
                    timeoutId = setTimeout(() => {
                        timeoutId = null;
                        console.log(`Timeout на попытке ${placeholderAttempt + 1}: ${imgUrl}`);
                        onFail('Превышено время ожидания');
                    }, LOAD_TIMEOUT);

                    function cleanup() {
                        if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }
                        img.removeEventListener('load', onLoad);
                        img.removeEventListener('error', onError);
                    }

                    function onLoad() {
                        cleanup();

                        const w = img.naturalWidth;
                        const h = img.naturalHeight;
                        console.log(`Загружено: ${w}×${h} (попытка ${placeholderAttempt + 1}): ${imgUrl}`);

                        // Проверяем, не заглушка ли
                        if (w < MIN_REAL_WIDTH || h < MIN_REAL_HEIGHT) {
                            placeholderAttempt++;

                            if (placeholderAttempt <= PLACEHOLDER_RETRIES) {
                                // Ждём и пробуем снова
                                const delay = RETRY_DELAYS[placeholderAttempt - 1] || 3000;
                                console.log(`Заглушка! Повтор через ${delay}мс (${placeholderAttempt}/${PLACEHOLDER_RETRIES})`);
                                showRetryLabel(img, placeholderAttempt);
                                setTimeout(tryOnce, delay);
                                return;
                            }

                            // Все попытки исчерпаны — показываем ошибку
                            showImageError(img, imgUrl);
                            resolve();
                            return;
                        }

                        // Реальная картинка — готово!
                        img.classList.remove('img-loading', 'img-retrying');
                        img.alt = 'Решение';
                        resolve();
                    }

                    function onError() {
                        cleanup();
                        onFail('Ошибка загрузки');
                    }

                    img.addEventListener('load', onLoad, { once: true });
                    img.addEventListener('error', onError, { once: true });

                    // Параметр t=Date.now() — обход кэша браузера
                    img.src = '/api/image?url=' + encodeURIComponent(imgUrl)
                        + '&w=1000&t=' + Date.now();
                }

                function onFail(reason) {
                    placeholderAttempt++;

                    if (placeholderAttempt <= PLACEHOLDER_RETRIES) {
                        const delay = RETRY_DELAYS[placeholderAttempt - 1] || 3000;
                        console.log(`${reason} — повтор через ${delay}мс (${placeholderAttempt}/${PLACEHOLDER_RETRIES})`);
                        showRetryLabel(img, placeholderAttempt);
                        setTimeout(tryOnce, delay);
                        return;
                    }

                    console.log(`Все попытки исчерпаны: ${imgUrl}`);
                    showImageError(img, imgUrl);
                    resolve();
                }

                tryOnce();
            }));
        }

        // ─── ОСНОВНОЙ ПОИСК ──────────────────────────────
        btn.addEventListener('click', async () => {
            const jobs = [];
            SUBJECTS.forEach(s => {
                const input = document.getElementById(s.id);
                const numbers = input.value.trim();
                if (numbers) {
                    jobs.push({ subject: s.subject, url: s.url, numbers: numbers });
                }
            });

            if (jobs.length === 0) {
                return showStatus('⚠️ Введи номера хотя бы в одном поле', 'error');
            }

            btn.disabled = true;
            result.innerHTML = '';

            let seconds = 0;
            showStatus('⏳ Ищу решения... 0 сек', 'loading');
            const timer = setInterval(() => {
                seconds++;
                let hint = '';
                if (seconds < 5) hint = 'Проверяем задания...';
                else if (seconds < 15) hint = 'Загружаем страницы...';
                else if (seconds < 30) hint = 'Обрабатываем решения...';
                else hint = 'Осталось немного...';
                showStatus(`⏳ Ищу решения... ${seconds} сек (${hint})`, 'loading');
            }, 1000);

            try {
                const resp = await fetch('/api/parse', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({jobs})
                });
                const data = await resp.json();
                clearInterval(timer);

                if (!resp.ok) {
                    return showStatus('❌ ' + (data.detail || 'Ошибка'), 'error');
                }
                if (data.total === 0) {
                    return showStatus('🤷 Ничего не найдено', 'error');
                }

                const found = data.results.filter(r => r.found).length;
                showStatus(
                    `✅ Найдено ${found} из ${data.total} за ${seconds} сек`,
                    found > 0 ? 'success' : 'error'
                );

                const bySubject = {};
                data.results.forEach(r => {
                    (bySubject[r.subject] = bySubject[r.subject] || []).push(r);
                });

                Object.entries(bySubject).forEach(([subject, items]) => {
                    const sec = document.createElement('section');
                    sec.className = 'subject-block';
                    sec.innerHTML = `<h2>${subject}</h2>`;
                    items.forEach(r => {
                        const card = document.createElement('div');
                        card.className = 'task-card' + (r.found ? '' : ' not-found');
                        card.innerHTML = `<div class="task-header">
                            <h3>№${r.number}</h3>
                            ${r.found ? '' : '<span class="badge">не найдено</span>'}
                        </div>`;

                        if (r.found) {
                            r.images.forEach((imgUrl) => {
                                const img = document.createElement('img');
                                img.className = 'solution-img img-loading';
                                img.alt = 'Загрузка...';
                                img.addEventListener('click',
                                    () => window.open(img.src, '_blank'));
                                loadImage(img, imgUrl);
                                card.appendChild(img);
                            });
                        }
                        sec.appendChild(card);
                    });
                    result.appendChild(sec);
                });
            } catch (err) {
                clearInterval(timer);
                showStatus('❌ Ошибка: ' + err.message
                    + '. Попробуй ещё раз — сервер мог засыпать.', 'error');
            } finally {
                btn.disabled = false;
            }
        });

        function showStatus(text, type) {
            status.textContent = text;
            status.className = 'status ' + type;
        }
    </script>
</body>
</html>
